services:
  app:
    build: .
    container_name: codebase-rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # .env is written for the host, where postgres is published on 5433.
      # Inside the network "localhost" is this container, so the inherited
      # value would point the app at itself and fail to connect.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codebase_rag}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Clones are expensive to rebuild and a bind mount of ./app would shadow
      # the code baked into the image, so the tree gets a named volume instead.
      - repository_data:/code/data
      - huggingface_cache:/code/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: codebase-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codebase_rag}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codebase_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  repository_data:
  huggingface_cache:
